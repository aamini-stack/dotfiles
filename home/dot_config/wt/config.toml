workspace-path = "~/.herdr/workspaces/{{ repo }}/{{ name | sanitize_hash }}"

[[post-create]]
copy-envs = "wt copy-ignored"

[[post-remove]]
close-herdr = "herdr-jj close --name '{{ name }}' --path '{{ workspace_path }}' --primary '{{ primary_path }}'"

[copy-ignored]
exclude = [".env.compose", "**/.venv/", "*node_modules/*"]
