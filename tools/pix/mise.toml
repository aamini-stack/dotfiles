[tools]
bun = "1"

[tasks.install]
description = "Install pix dependencies and the ~/.local/bin launcher"
sources = ["package.json", "bun.lock", "src/**/*.ts"]
run = '''
bun install
mkdir -p "$HOME/.local/bin"
rm -f "$HOME/.local/bin/pix"
printf '#!/bin/sh\nexec bun run "%s" "$@"\n' "{{config_root}}/src/index.ts" > "$HOME/.local/bin/pix"
chmod +x "$HOME/.local/bin/pix"
'''

[tasks.check]
description = "Typecheck pix"
sources = ["src/**/*.ts", "package.json", "bun.lock"]
run = "bunx tsc --noEmit"
