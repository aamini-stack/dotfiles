[tools]
python = "3.14"

[deps.uv]
auto = true

[tasks.sync]
description = "Install locked development dependencies"
run = "mise deps uv --force"

[tasks.lint]
description = "Lint Python sources"
sources = ["**/*.py", "pyproject.toml", "uv.lock"]
run = "ruff check ."

[tasks.format]
description = "Format Python sources"
run = "ruff format ."

[tasks."format:check"]
description = "Check Python formatting"
sources = ["**/*.py", "pyproject.toml", "uv.lock"]
run = "ruff format --check ."

[tasks.test]
description = "Run unit tests"
sources = ["**/*.py", "uv.lock"]
run = 'uv run --python "$(command -v python)" python -m pytest -q'

[tasks.check]
description = "Run all checks"
depends = [":lint", ":format:check", ":test"]

[tasks.install]
description = "Install as an editable uv tool"
sources = ["pyproject.toml", "src/**/*.py"]
run = 'uv tool install --python "$(command -v python)" --editable --reinstall .'
