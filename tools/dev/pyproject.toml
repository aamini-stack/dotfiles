[project]
name = "dev-cli"
version = "0.1.0"
description = "Connect Herdr to managed SSH development boxes"
requires-python = ">=3.11"

[project.scripts]
dev = "devcli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devcli"
