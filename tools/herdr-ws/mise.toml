[tools]
python = "3.13"

[tasks.sync]
description = "Install locked dependencies"
run = "uv sync --locked --python \"$(command -v python)\""

[tasks.lint]
description = "Lint herdr-ws"
run = "ruff check src tests"

[tasks.format]
description = "Format herdr-ws"
run = "ruff format src tests"

[tasks."format:check"]
description = "Check herdr-ws formatting"
run = "ruff format --check src tests"

[tasks.test]
description = "Test herdr-ws"
run = "uv run --python \"$(command -v python)\" python -m unittest discover -s tests -v"

[tasks.check]
description = "Run all herdr-ws checks"
depends = [":lint", ":format:check", ":test"]

[tasks.install]
description = "Install herdr-ws as an editable uv tool"
run = "uv tool install --python \"$(command -v python)\" --editable --reinstall ."
