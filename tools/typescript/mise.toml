[tasks.install]
description = "Install TS tool dependencies"
sources = ["pix/package.json", "pix/bun.lock"]
run = "bun install --cwd pix"

[tasks."pix:start"]
description = "Run pix"
dir = "pix"
run = "bun run src/index.ts"

[tasks.check]
description = "Typecheck TS tools"
dir = "pix"
sources = ["pix/src/**/*.ts", "pix/package.json", "pix/bun.lock"]
run = "bunx tsc --noEmit"
