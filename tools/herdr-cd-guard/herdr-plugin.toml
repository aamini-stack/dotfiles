id = "aamini.cd-guard"
name = "cd guard"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Block cd outside the herdr workspace root (zsh chpwd hook + per-workspace toggle)."
platforms = ["linux", "macos"]

# Toggle the guard for the current workspace (writes the `disabled` state file
# the zsh hook reads).
[[actions]]
id = "toggle"
title = "cd guard: toggle for this workspace"
contexts = ["workspace"]
command = ["./toggle.sh"]

# Pin the guard root for this workspace to the focused pane's cwd.
[[actions]]
id = "set-root"
title = "cd guard: set root to focused pane cwd"
contexts = ["workspace"]
command = ["./set-root.sh"]

# Show root + enabled/disabled for the current workspace.
[[actions]]
id = "status"
title = "cd guard: status"
contexts = ["workspace"]
command = ["./status.sh"]
