[tools]
python = "3.14"

[deps.uv]
auto = true

[tasks.lint]
description = "Lint Python sources"
sources = ["**/*.py", "pyproject.toml"]
run = "ruff check ."

[tasks."format:check"]
description = "Check Python formatting"
sources = ["**/*.py", "pyproject.toml"]
run = "ruff format --check ."

[tasks.check]
description = "Run all checks"
depends = [":lint", ":format:check"]

[tasks.install]
description = "Install as an editable uv tool"
sources = ["pyproject.toml", "src/**/*.py"]
run = 'uv tool install --python "$(command -v python)" --editable --reinstall .'
