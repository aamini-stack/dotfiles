# Project-level Worktrunk config for uv/Python projects.

[[pre-start]]
env = "WORKTREE_NAME='{{ worktree_name }}' COMPOSE_NAME='{{ worktree_name | sanitize_db }}' APP_PORT='{{ branch | hash_port }}' DATABASE_PORT='{{ ('db-' ~ branch) | hash_port }}' DB_NAME='{{ branch | sanitize_db }}' wt-generate-env"

[[pre-start]]
install = "uv sync"

[[post-start]]
compose = "docker compose -f compose.yaml up -d"

[[post-start]]
server = "wt step tether -- uv run uvicorn app:main --reload --port {{ branch | hash_port }}"

[pre-remove]
compose-down = "docker compose -f compose.yaml down"

[list]
url = "http://localhost:{{ branch | hash_port }}"
