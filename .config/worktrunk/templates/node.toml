# Project-level Worktrunk config for Node/Vite+ projects.

[[pre-start]]
env = "WORKTREE_NAME='{{ worktree_name }}' COMPOSE_NAME='{{ worktree_name | sanitize_db }}' APP_PORT='{{ branch | hash_port }}' DATABASE_PORT='{{ ('db-' ~ branch) | hash_port }}' DB_NAME='{{ branch | sanitize_db }}' wt-generate-env"

[[pre-start]]
install = "vp i"

[[post-start]]
compose = "vp run compose:up"

[[post-start]]
server = "wt step tether -- vp run dev -- --port {{ branch | hash_port }}"

[pre-remove]
compose-down = "vp run compose:down"

[list]
url = "http://localhost:{{ branch | hash_port }}"
