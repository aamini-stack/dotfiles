[ui]
pager = ["hunk", "pager"]
diff-formatter = ["difft", "--color=always", "$left", "$right"]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]

[user]
name = "Aria Amini"
email = "amini5454@gmail.com"

[snapshot]
auto-update-stale = true

# Keep jjui's revision graph compact without changing `jj log` in a shell.
[[--scope]]
--when.environments = ["JJUI"]

[--scope.template-aliases]
'format_short_commit_header(commit)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  commit.bookmarks(),
  commit.tags(),
  format_jjui_working_copies(commit),
  format_short_commit_id(commit.commit_id()),
  format_commit_labels(commit),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''
'format_jjui_working_copies(commit)' = '''
commit.working_copies().map(|workspace|
  if(workspace.target().current_working_copy(),
    label("workspace current", workspace),
    label("workspace other", workspace),
  )
).join(" ")
'''

[--scope.colors]
bookmark = { fg = "bright yellow", bold = true }
bookmarks = { fg = "bright yellow", bold = true }
local_bookmarks = { fg = "bright yellow", bold = true }
remote_bookmarks = { fg = "bright yellow", bold = true }
commit_id = "bright black"
"description placeholder" = { fg = "bright black", italic = true }
"empty description placeholder" = { fg = "bright black", italic = true }
"workspace current" = { fg = "bright cyan", bold = true }
"workspace other" = { fg = "bright black" }
