conky.config = {
    background = false,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = true,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = false,
    update_interval = 1.0,
    use_spacer = 'left',
}

conky.text = [[
$nodename  $sysname $kernel $machine
Uptime     $uptime
CPU        ${cpu}% ${cpubar 30}
Load       $loadavg
Memory     $mem / $memmax ($memperc%) ${membar 30}
Disk /     ${fs_used /} / ${fs_size /} (${fs_used_perc /}%) ${fs_bar 30 /}
Processes  $processes total, $running_processes running

Name                 PID    CPU%   MEM%
${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
${top name 5} ${top pid 5} ${top cpu 5} ${top mem 5}
]]
