[env]
_.file = { path = "~/.env" }

[settings]
experimental = true
minimum_release_age = "1d"
idiomatic_version_file_enable_tools = ["node"]
trusted_config_paths = ["~/.herdr/worktrees/"]

[plugins]
nix = "https://github.com/jbadeau/mise-nix.git"
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
#===============================================================================
# Language Toolchains
#===============================================================================

# Python
uv = "latest"
"pipx:basedpyright" = "latest"
"pipx:ruff" = "latest"

# Rust
rust = "latest"

# Dotnet
dotnet = "10"

# Node
vite-plus = "latest"
node = "22"
"npm:corepack" = "latest"
"npm:pnpm" = "latest"
"npm:@typescript/native-preview" = "7.0.0-dev.20260701.1"

# LSPs
"npm:@tailwindcss/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"github:LuaLS/lua-language-server" = "3.18.2"
"npm:markdownlint-cli2" = "latest"
"github:JohnnyMorganz/StyLua" = "latest"
"github:tamasfe/taplo" = "latest"
tflint = "0.63.1"
hadolint = "2.14.0"
"npm:jsonlint" = "1.6.3"
shellcheck = "latest"

#===============================================================================
# CLIs/Editors
#===============================================================================

# Shell
herdr = "0.7.3"
"nix:zsh" = "latest"
"oh-my-posh" = "latest"

# AI
"opencode" = "latest"
"pi" = "latest"
"npm:playwriter" = "latest"
claude = "latest"
"npm:lavish-axi" = "latest"

# CLIs 
"bat" = "latest"
jq = "latest"
"fd" = "latest"
"eza" = "latest"
"just" = "latest"
"fzf" = "latest"
"yazi" = "latest"
"zoxide" = "latest"
"delta" = "latest"
"difftastic" = "latest"
"ripgrep" = "latest"
"lazygit" = "latest"
"nix:erdtree" = "latest"
"worktrunk" = "latest"
"nix:gh-dash" = "latest"
"aqua:joshmedeski/sesh" = "latest"
"github-cli" = "latest"
"nix:stow" = "latest"
"pipx:azure-cli" = { version = "latest", uvx_args = "--prerelease=allow" }
kubectl = "latest"
helm = "latest"
"npm:hunkdiff" = "latest"
pulumi = "latest"
railway = "5.23.0"

# nvim
"neovim" = "0.12.2"
"nix:tree-sitter" = "latest"
"nix:gnumake" = "latest"
"nix:unzip" = "latest"
"nix:xclip" = "latest"
make = "latest"
"nix:gcc" = "15.2.0"

# misc
"nix:postgresql_18" = "latest"

# images
imagemagick = "latest"
"github:danielgatis/imgcat" = "latest"
"nix:chafa" = "latest"

[tasks.diff]
dir = "{{cwd}}"
usage = '''
arg "[expected]" help="Baseline/expected screenshot"
arg "[actual]" help="Actual screenshot"
flag "-f --format <format>" help="Diff format: side-by-side or overlay" default="side-by-side"
'''
run = '''
set -eu
cd "$(git rev-parse --show-toplevel)"
tmp_dir="$(mktemp -d -t mise-diff-XXXXXX)"
cleanup() { rm -rf "$tmp_dir"; }
trap cleanup EXIT
fmt="${usage_format:-side-by-side}"
make_diff() {
  expected="$1"
  actual="$2"
  out="$3"
  if [ "$fmt" = "side-by-side" ]; then
    magick "$expected" "$actual" +append "$out"
  elif [ "$fmt" = "overlay" ]; then
    magick compare "$expected" "$actual" "$out" || true
  else
    echo "Unknown format: $fmt" >&2
    exit 1
  fi
}
if [ -n "${usage_expected:-}" ] && [ -n "${usage_actual:-}" ]; then
  make_diff "${usage_expected}" "${usage_actual}" "$tmp_dir/single.png"
  final="$tmp_dir/single.png"
else
  files="$(git diff --name-only --diff-filter=M | grep -E '\.(png|jpg|jpeg|webp|gif)$' || true)"
  if [ -z "$files" ]; then
    echo "No modified photos to diff"
    exit 0
  fi
  i=0
  echo "$files" | while IFS= read -r f; do
    i=$((i + 1))
    p="$(printf '%03d' "$i")"
    before="$tmp_dir/$p-before.png"
    pair="$tmp_dir/$p-pair.png"
    git show HEAD:"$f" > "$before"
    make_diff "$before" "$f" "$pair"
    magick -background black -fill white -gravity west -size 1600x30 "label:$f" "$pair" -append "$tmp_dir/$p-row.png"
  done
  final="$tmp_dir/final.png"
  magick "$tmp_dir"/*-row.png -append "$final"
fi
echo "Format: $fmt"
echo
chafa -f kitty --fit-width "$final" 2>/dev/null || imgcat "$final" || chafa --fit-width "$final"
'''
