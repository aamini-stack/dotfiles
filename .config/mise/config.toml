[env]
_.file = { path = "~/.env" }

[settings]
experimental = true
minimum_release_age = "3d"
idiomatic_version_file_enable_tools = ["node"]

[plugins]
nix = "https://github.com/jbadeau/mise-nix.git"
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
node = "22"
uv = "latest"
vite-plus = "latest"

# dev
"nix:zsh" = "latest"
"oh-my-posh" = "latest"
"opencode" = { version = "latest", minimum_release_age = "1d" }
"pi" = "latest"
"github-cli" = "latest"
"nix:stow" = "latest"
"pipx:azure-cli" = { version = "latest", uvx_args = "--prerelease=allow" }
kubectl = "latest"
helm = "latest"
"npm:playwriter" = "latest"

# lang
"npm:corepack" = "latest"
"npm:pnpm" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"pipx:basedpyright" = "latest"
"pipx:ruff" = "latest"
"npm:markdownlint-cli" = "latest"

# modern command line tools 
"bat" = "latest"
"fd" = "latest"
"eza" = "latest"
"just" = "latest"
"fzf" = "latest"
"yazi" = "latest"
"zoxide" = "latest"
"delta" = "latest"
"difftastic" = "latest"
"ripgrep" = "latest"
"nix:git-town" = "latest"
"lazygit" = "latest"
"nix:erdtree" = "latest"
"worktrunk" = "latest"
"nix:gh-dash" = "latest"
"aqua:joshmedeski/sesh" = "latest"

# nvim
"neovim" = "0.12.2"
"nix:tree-sitter" = "latest"
"nix:gnumake" = "latest"
"nix:unzip" = "latest"
"nix:xclip" = "latest"
make = "latest"
"nix:gcc" = "latest"
"github:owenthereal/upterm" = "latest"
