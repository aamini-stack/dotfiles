"eza" = "latest"
"just" = "latest"
"fzf" = "latest"
"yazi" = "latest"
"zoxide" = "latest"
"delta" = "latest"
"difftastic" = "latest"
"ripgrep" = "latest"
"nix:git-town" = "latest"
"lazygit" = "latest"
"nix:erdtree" = "latest"
"worktrunk" = "latest"
"nix:gh-dash" = "latest"
