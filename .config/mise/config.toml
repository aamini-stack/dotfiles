[env]
_.file = { path = "~/.env" }

[settings]
experimental = true
minimum_release_age = "1d"
idiomatic_version_file_enable_tools = ["node"]
trusted_config_paths = ["~/.herdr/worktrees/"]

[plugins]
nix = "https://github.com/jbadeau/mise-nix.git"
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
#===============================================================================
# Language Toolchains
#===============================================================================

# Python
uv = "latest"
"pipx:basedpyright" = "latest"
"pipx:ruff" = "latest"

# Rust
rust = "latest"

# Dotnet
dotnet = "10"

# Node
vite-plus = "latest"
node = "22"
"npm:corepack" = "latest"
"npm:pnpm" = "latest"
"npm:@typescript/native-preview" = "7.0.0-dev.20260701.1"

# LSPs
"npm:@tailwindcss/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"github:LuaLS/lua-language-server" = "3.18.2"
"npm:markdownlint-cli2" = "latest"
"cargo:stylua" = "latest"
"cargo:taplo-cli" = "latest"
tflint = "0.63.1"
hadolint = "2.14.0"
"npm:jsonlint" = "1.6.3"
shellcheck = "latest"

#===============================================================================
# CLIs/Editors
#===============================================================================

# Shell
herdr = "latest"
"nix:zsh" = "latest"
"oh-my-posh" = "latest"

# AI
"opencode" = "latest"
"pi" = "latest"
"npm:playwriter" = "latest"
claude = "latest"

# CLIs 
"bat" = "latest"
jq = "latest"
"fd" = "latest"
"eza" = "latest"
"just" = "latest"
"fzf" = "latest"
"yazi" = "latest"
"zoxide" = "latest"
"delta" = "latest"
"difftastic" = "latest"
"ripgrep" = "latest"
"lazygit" = "latest"
"nix:erdtree" = "latest"
"worktrunk" = "latest"
"nix:gh-dash" = "latest"
"aqua:joshmedeski/sesh" = "latest"
"github-cli" = "latest"
"nix:stow" = "latest"
"pipx:azure-cli" = { version = "latest", uvx_args = "--prerelease=allow" }
kubectl = "latest"
helm = "latest"

# nvim
"neovim" = "0.12.2"
"nix:tree-sitter" = "latest"
"nix:gnumake" = "latest"
"nix:unzip" = "latest"
"nix:xclip" = "latest"
make = "latest"
"nix:gcc" = "15.2.0"
"nix:postgresql_17" = "latest"
