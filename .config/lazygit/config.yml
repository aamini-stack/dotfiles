promptToReturnFromSubprocess: true
os:
  copyToClipboardCmd: >
    if [[ "$TERM" =~ ^(screen|tmux) ]]; then
      printf "\033Ptmux;\033\033]52;c;$(printf {{text}} | base64 -w 0)\a\033\\"
    > /dev/tty
    else
      printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
    fi
git:
  pagers:
    - pager: delta --dark --paging=never --line-numbers --side-by-side --tabs 2
      colorArg: always
    - externalDiffCommand: difft --color=always
