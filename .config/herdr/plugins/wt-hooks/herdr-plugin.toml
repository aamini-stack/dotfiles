id = "local.wt-hooks"
name = "wt hooks"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Run wt hook pre-start and post-start after a herdr worktree is created"
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["bash", "worktree-created.sh"]

[[events]]
on = "worktree.removed"
command = ["bash", "worktree-removed.sh"]

