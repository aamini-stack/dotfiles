[ui.colors]
"selected" = { bg = "#313244" }

[preview]
revision_command = [
  "util",
  "exec",
  "--",
  "/home/aamini.linux/.config/jjui/revision-preview.sh",
  "$change_id",
]
oplog_command = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  "jj op show $operation_id --git --color always | delta --dark --paging=never --line-numbers --side-by-side --tabs 2",
]
file_command = [
  "util",
  "exec",
  "--",
  "/home/aamini.linux/.config/jjui/file-preview.sh",
  "$change_id",
  "$file",
]
