[ui.colors]
"selected" = { bg = "#313244" }

[preview]
revision_command = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  'set -o pipefail; jj show --color always --git -r "$1" | delta --dark --paging=never --line-numbers --side-by-side --tabs 2',
  "jjui-preview",
  "$change_id",
]
oplog_command = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  'set -o pipefail; jj op show "$1" --git --color always | delta --dark --paging=never --line-numbers --side-by-side --tabs 2',
  "jjui-preview",
  "$operation_id",
]
file_command = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  'set -o pipefail; jj diff --color always --git -r "$1" -- "$2" | delta --dark --paging=never --line-numbers --side-by-side --tabs 2',
  "jjui-preview",
  "$change_id",
  "$file",
]
