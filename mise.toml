monorepo_root = true

[tools]
"aqua:tailscale/tailscale" = "latest"
node = "24"

[monorepo]
config_roots = ["tools/*"]

[shell_alias]
dots = "cd {{config_root}}"

[tasks.tailscaled]
description = "Run tailscaled in userspace mode (no root needed)"
run = '''
mkdir -p "$HOME/.local/share/tailscale"
exec tailscaled --tun=userspace-networking \
  --statedir="$HOME/.local/share/tailscale" \
  --socket="$HOME/.local/share/tailscale/tailscaled.sock"
'''

[tasks.ts]
description = "tailscale CLI against the userspace daemon"
run = 'tailscale --socket="$HOME/.local/share/tailscale/tailscaled.sock" "$@"'

[tasks.install]
description = "Install all dotfiles tools"
depends = ["//tools/...:install"]

[tasks.check]
description = "Run all checks"
depends = ["//tools/...:check"]

[tasks.restow]
description = "Restow dotfiles into $HOME"
dir = "{{config_root}}"
run = 'stow --restow -v --target="$HOME" .'
