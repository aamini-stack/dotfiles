_min_copier_version: '9'
_subdirectory: apps/tanstack

app_name:
  type: str
  help: App name in kebab-case (e.g. cool-app)
  validator: >-
    {%- set ns = namespace(bad=false) -%} {%- for ch in app_name -%} {%- if not
    ('a' <= ch <= 'z' or '0' <= ch <= '9' or ch == '-') -%} {%- set ns.bad =
    true -%} {%- endif -%} {%- endfor -%} {%- if ns.bad or app_name == '' or
    '--' in app_name or app_name[0] == '-' or app_name[-1] == '-' %} app_name
    must be kebab-case (lowercase letters, digits, single hyphens) {%- endif %}

app_name_snake:
  type: str
  help: Snake-case identifier (used for the dev database name)
  default: "{{ app_name | replace('-', '_') }}"
  when: false

sentry:
  type: bool
  help: Error monitoring via @sentry/tanstackstart-react
  default: true

sentry_org:
  type: str
  help: Sentry organization slug (from your Sentry org settings)
  when: '{{ sentry }}'

sentry_project:
  type: str
  help: Sentry project slug
  default: '{{ app_name }}'
  when: '{{ sentry }}'

sentry_dsn:
  type: str
  help: Sentry client DSN (public, safe to commit)
  when: '{{ sentry }}'
  validator: >-
    {% if not (sentry_dsn.startswith('https://') and '.ingest.' in sentry_dsn
    and 'sentry.io' in sentry_dsn) %} sentry_dsn must look like
    https://<key>@o<org-id>.ingest.<region>.sentry.io/<project-id> {% endif %}

posthog:
  type: bool
  help: Product analytics via @posthog/react behind a /api/ingest proxy
  default: true

posthog_project_token:
  type: str
  help: PostHog project token (public client key, safe to commit)
  when: '{{ posthog }}'

google_auth:
  type: bool
  help: Google OAuth sign-in alongside email/password
  default: true

google_client_id:
  type: str
  help:
    Google OAuth "Web application" client ID for deployed envs (dev reuses the
    shared "Desktop app" client)
  when: '{{ google_auth }}'
  validator: >-
    {% if not google_client_id.endswith('.apps.googleusercontent.com') %}
    google_client_id must end with .apps.googleusercontent.com {% endif %}

_templates_suffix: '.jinja'

# Value files hold per-instance secrets/local config; never overwrite on update.
# .env.schema remains template-managed as the contract.
_skip_if_exists:
  - .env.local
  - .env.development.local
  - .env.preview
  - .env.production

_exclude:
  - 'copier.yml'
  - 'node_modules/**'
  - |
    {% if _copier_operation == 'update' %}
    .env.local
    .env.development.local
    .env.preview
    .env.production
    {% endif %}
  - '{% if not sentry %}instrument.server.mjs{% endif %}'
  - '{% if not sentry %}src/instrument.client.ts{% endif %}'
  - '{% if not posthog %}src/lib/analytics/posthog.server.ts{% endif %}'
  - '{% if not posthog %}src/lib/utils/proxy.ts{% endif %}'
  - '{% if not posthog %}src/lib/utils/proxy.unit.test.ts{% endif %}'
  - '{% if not posthog %}src/routes/api/ingest.$.ts{% endif %}'
  - '{% if not google_auth %}src/components/google-auth-button.tsx{% endif %}'
  - '{% if not google_auth %}src/lib/auth/use-google-auth.ts{% endif %}'

_tasks:
  - '[ -d .jj ] || jj git init --colocate 2>/dev/null || jj git init'
  # copier materializes parent dirs of _excluded files; drop the husks
  - 'find src e2e -depth -type d -empty -delete'

_message_after_copy: |
  Next steps:
    cd {{ _copier_conf.dst_path }}
    mise trust && mise install
    mise run bootstrap
    vp dev
